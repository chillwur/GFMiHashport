name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Apps (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  contract:
    name: Contract (fmt, test, wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/hashport-account
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32v1-none
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/hashport-account

      - name: Format check
        run: make fmt-check

      - name: Test
        run: make test

      - name: Build wasm
        run: cargo build --target wasm32v1-none --release
